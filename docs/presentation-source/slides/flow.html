<section id="flow" style="background:#f6f3ec;color:#14213d;font-family:Georgia, 'Times New Roman', serif;padding:128px 128px 160px;display:flex;flex-direction:column;justify-content:flex-start;gap:36px"><p style="position:absolute;left:128px;top:48px;width:1664px;font-size:26px;color:#b3261e">Geethanjali College of Engineering and Technology (Autonomous)</p><h2 style="font-size:68px;font-weight:700;line-height:1.1;color:#b3261e">Flowchart</h2><svg aria-label="Flowchart of secure file transfer from connection and key exchange to encryption, transfer, verification and accept or reject" viewBox="0 0 1664 600" width="1664" height="600" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif"><rect x="0" y="10" width="340" height="120" rx="14" fill="#ffffff" stroke="#b3261e" stroke-width="3"/><text x="170.0" y="64.0" text-anchor="middle" font-size="28" font-weight="700" fill="#14213d">1. Connect</text><text x="170.0" y="98.0" text-anchor="middle" font-size="26" fill="#14213d">Opens TCP socket</text><line x1="340" y1="70" x2="425" y2="70" stroke="#14213d" stroke-width="4"/><polygon points="441,70 425,62 425,78" fill="#14213d"/><rect x="441" y="10" width="340" height="120" rx="14" fill="#ffffff" stroke="#14213d" stroke-width="3"/><text x="611.0" y="64.0" text-anchor="middle" font-size="28" font-weight="700" fill="#14213d">2. Public key</text><text x="611.0" y="98.0" text-anchor="middle" font-size="26" fill="#14213d">Server sends RSA key</text><line x1="781" y1="70" x2="866" y2="70" stroke="#14213d" stroke-width="4"/><polygon points="882,70 866,62 866,78" fill="#14213d"/><rect x="882" y="10" width="340" height="120" rx="14" fill="#ffffff" stroke="#14213d" stroke-width="3"/><text x="1052.0" y="64.0" text-anchor="middle" font-size="28" font-weight="700" fill="#14213d">3. Session key</text><text x="1052.0" y="98.0" text-anchor="middle" font-size="26" fill="#14213d">AES key via RSA</text><line x1="1222" y1="70" x2="1307" y2="70" stroke="#14213d" stroke-width="4"/><polygo nchor="middle" font-size="26" font-weight="700" fill="#14213d">8. Hash</text><text x="611" y="502" text-anchor="middle" font-size="26" font-weight="700" fill="#14213d">match?</text><rect x="0" y="415" width="340" height="120" rx="14" fill="#ffffff" stroke="#2e7d32" stroke-width="3"/><text x="170.0" y="469.0" text-anchor="middle" font-size="28" font-weight="700" fill="#14213d">Save file</text><text x="170.0" y="503.0" text-anchor="middle" font-size="26" fill="#14213d">Show success. End</text><line x1="441" y1="475" x2="356" y2="475" stroke="#2e7d32" stroke-width="4"/><polygon points="340,475 356,483 356,467" fill="#2e7d32"/><text x="390" y="455" text-anchor="middle" font-size="24" font-weight="700" fill="#2e7d32">Yes</text><rect x="882" y="415" width="340" height="120" rx="14" fill="#ffffff" stroke="#b3261e" stroke-width="3"/><text x="1052.0" y="469.0" text-anchor="middle" font-size="28" font-weight="700" fill="#14213d">Reject file</text><text x="1052.0" y="503.0" text-anchor="middle" font-size="26" fill="#14213d">Show error. End</text><line x1="781" y1="475" x2="866" y2="475" stroke="#b3261e" stroke-width="4"/><polygon points="882,475 866,467 866,483" fill="#b3261e"/><text x="831" y="455" text-anchor="middle" font-size="24" font-weight="700" fill="#b3261e">No</text></svg><p style="position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#14213d;opacity:0.7">Department of CSE (CYBER SECURITY) PBL &nbsp;|&nbsp; 8</p></section>
